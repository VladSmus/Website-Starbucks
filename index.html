<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StarBucks</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="images/icons/starbucks_icon.png"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body id="top">
    <header class="header">
      <div class="container">
        <a href="#!" class="logo text-gradient header__logo">StarBucks</a>

        <nav class="header__nav">
          <a href="#home" class="header__link">Home</a>
          <a href="#events" class="header__link">Events</a>
          <a href="#shop" class="header__link">Shop</a>
        </nav>
      </div>
    </header>
    <main class="main" id="main">
      <section class="welcome">
        <div class="container">
          <div class="welcome__desc">
            <h1 class="title welcome__title">
              New Cafe by&nbsp;<span class="text-gradient">StarBucks</span>
            </h1>
            <p class="welcome__text">
              Have time to buy the most harmonious drinks in the
              new&nbsp;Starbucks coffee and don't forget about the discount!
            </p>
            <div class="welcome__btns-wrapper">
              <a href="#select" class="btn">Select a coffee</a>
              <a target="_blank" href="#!" class="link">More</a>
            </div>
            <div class="stats">
              <p class="stats__item">
                <span class="stats__num">9k</span>
                Premium Users
              </p>
              <p class="stats__item">
                <span class="stats__num">2k</span>
                Happy Customers
              </p>
              <p class="stats__item">
                <span class="stats__num">28</span>
                Awards Winning
              </p>
            </div>
          </div>

          <div class="welcome__img-wrapper">
            <img
              src="./images/cups/green-big.png"
              alt="coffee"
              class="welcome__img"
            />
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
